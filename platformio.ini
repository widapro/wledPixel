[platformio]
default_envs = d1_mini, esp32

[env:d1_mini]
platform = espressif8266 @ 4.2.1
board = d1_mini
board_build.f_cpu = 160000000L
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = chain
extra_scripts =
    pre:tools/build_html.py
    pre:tools/patch_display_driver.py
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps = 
	bblanchon/ArduinoJson @ 6.21.3
	me-no-dev/ESPAsyncTCP @ 1.2.2
	https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
	alanswx/ESPAsyncWiFiManager @ 0.31
	majicdesigns/MD_MAX72XX @ 3.5.1
	majicdesigns/MD_Parola @ 3.7.5
	knolleary/PubSubClient @ 2.8
	arduino-libraries/NTPClient @ 3.2.1
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 4.0.5
	vshymanskyy/Preferences @ 2.2.2

[env:esp32]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = chain
extra_scripts =
    pre:tools/build_html.py
    pre:tools/patch_display_driver.py
build_flags = -DMQTT_MAX_PACKET_SIZE=1024 -flto
build_unflags = -fno-lto
lib_deps = 
	bblanchon/ArduinoJson @ 6.21.3
	me-no-dev/AsyncTCP @ 3.3.2
	https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
	alanswx/ESPAsyncWiFiManager @ 0.31
	majicdesigns/MD_MAX72XX @ 3.5.1
	majicdesigns/MD_Parola @ 3.7.5
	knolleary/PubSubClient @ 2.8
	arduino-libraries/NTPClient @ 3.2.1
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 4.0.5

; Hardware-in-the-loop builds. WLED_HIL_TEST enables test-only HTTP routes;
; the normal d1_mini and esp32 firmware images do not contain those routes.
[env:d1_mini_hil]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -DWLED_HIL_TEST

[env:esp32_hil]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DWLED_HIL_TEST
